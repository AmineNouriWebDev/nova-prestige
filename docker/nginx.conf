user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 16M;
    client_body_temp_path /var/lib/nginx/tmp/client_body;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /var/www/html/public;
        index index.php;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Deny executing PHP scripts inside uploads
        location ~* ^/uploads/.*\.php$ {
            deny all;
            return 404;
        }

        # Deny direct access to protected folders and files
        location ~ ^/(app|database|\.env|composer\.|package\.) {
            deny all;
            return 404;
        }

        # Deny access to hidden files (.git, .env, etc.)
        location ~ /\. {
            deny all;
            return 404;
        }

        # Static assets caching: 1 year with immutable
        location ~* \.(css|js|woff2|woff|ttf|eot|svg|png|jpg|jpeg|webp|avif|ico|gif)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }

        # Front controller routing
        location / {
            try_files $uri /index.php?$query_string;
        }

        # PHP-FPM handler
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
        }
    }
}
